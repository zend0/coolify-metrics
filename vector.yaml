sources:
  docker:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    exclude_containers:
      - vector

transforms:
  normalize:
    type: remap
    inputs: [docker]
    source: |
      .nodename = get_env_var("NODE_NAME") ?? "unknown"
      del(.source_type)
      del(.host)
 
      if exists(.container_name) && starts_with(string!(.container_name), "/") {
        .container_name = slice!(string!(.container_name), 1)
      }

      if exists(.label) {
        .label = filter(object!(.label)) -> |key, value| {
          !(starts_with(key, "traefik") ||
            starts_with(key, "caddy") ||
            starts_with(key, "org.opencontainers.image.") ||
            key == "com.docker.compose.config-hash" ||
            key == "com.docker.compose.container-number" ||
            key == "maintainer")
        }
      }

sinks:
  victorialogs:
    type: elasticsearch
    inputs: [normalize]
    endpoints:
      - https://${VICTORIALOGS_ENDPOINT}/insert/elasticsearch/
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: nodename,label.coolify.projectName,label.coolify.environmentName,label.coolify.serviceName,stream
    tls:
      verify_certificate: false
      verify_hostname: false